spring.application.name=staynest

# DB — Railway auto-provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# when you link the PostgreSQL plugin — no manual setup needed!
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:staynest}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Railway dynamically assigns PORT
server.port=${PORT:8081}

# Security
jwt.secretKey=${JWT_SECRET_KEY:mySuperSecretKeyForStayNestApplication123456789}

# Frontend CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Stripe — set these as environment variables on Railway, never commit real keys
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}